<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticación JWT SENA</title>
    <style>
        :root {
            --bg-color: #e9e9e9;
            --card-bg: #d4d4d4;
            --accent-color: #c44c02;
            --text-color: #131212;
            --text-muted: #b0b0b0;
            --danger-color: #ff4d4d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            text-align: center;
            letter-spacing: 0.5px;
        }

        section {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            border: 1px solid #2a2a2a;
        }

        h2 {
            margin-top: 0;
            font-size: 1.4rem;
            margin-bottom: 1.5rem;
            color: var(--accent-color);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        input {
            padding: 0.85rem 1rem;
            background-color: #c4c2c2;
            border: 1px solid #3f3f3f;
            border-radius: 6px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        button {
            padding: 0.85rem;
            background-color: var(--accent-color);
            color: #121212;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 0.5rem;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.98);
        }

        a {
            display: inline-block;
            margin-top: 1.2rem;
            color: var(--accent-color);
            text-decoration: none;
            font-size: 0.9rem;
        }

        a:hover {
            text-decoration: underline;
        }

        #mensaje {
            margin-top: 1rem;
            font-size: 0.95rem;
            color: var(--danger-color);
            text-align: center;
        }

        #datosUsuario {
            font-size: 1.05rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>

    <h1>Sistema de autenticación</h1>

    <section id="seccionLogin">
        <h2>Iniciar sesión</h2>
        <form id="formLogin">
            <input id="usuario" placeholder="Usuario" required>
            <input id="clave" type="password" placeholder="Contraseña" required>
            <button type="submit">Ingresar</button>
        </form>
        <a href="/registro/">¿No tienes cuenta? Regístrate aquí</a>
    </section>

    <section id="seccionPanel" hidden>
        <h2>Panel de usuario</h2>
        <p id="datosUsuario"></p>
        <button id="salir">Cerrar sesión</button>
    </section>

    <p id="mensaje"></p>

    <script>
        let accessToken = null;
        let refreshToken = null;

        const login = document.getElementById("seccionLogin");
        const panel = document.getElementById("seccionPanel");
        const mensaje = document.getElementById("mensaje");

        document.getElementById("formLogin").addEventListener("submit", async (event) => {
            event.preventDefault();
            mensaje.textContent = "";

            const respuesta = await fetch("/api/token/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: document.getElementById("usuario").value,
                    password: document.getElementById("clave").value
                })
            });

            if (!respuesta.ok) {
                mensaje.textContent = "Usuario o contraseña incorrectos";
                return;
            }

            const datos = await respuesta.json();
            accessToken = datos.access;
            refreshToken = datos.refresh;
            await cargarPerfil();
        });

        async function cargarPerfil() {
            const respuesta = await fetch("/api/perfil/", {
                headers: {
                    "Authorization": "Bearer " + accessToken
                }
            });

            if (!respuesta.ok) {
                mensaje.textContent = "No fue posible validar el acceso";
                return;
            }

            const datos = await respuesta.json();
            login.hidden = true;
            panel.hidden = false;
            mensaje.textContent = "";
            document.getElementById("datosUsuario").textContent = "Bienvenido: " + datos.username + " | Correo: " + datos.email;
        }

        document.getElementById("salir").addEventListener("click", async () => {
            if (refreshToken) {
                try {
                    await fetch("/api/token/blacklist/", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            refresh: refreshToken
                        })
                    });
                } catch (error) {
                    mensaje.textContent = "No se pudo confirmar la revocación";
                }
            }

            accessToken = null;
            refreshToken = null;
            panel.hidden = true;
            login.hidden = false;
            document.getElementById("clave").value = "";
            mensaje.textContent = "";
        });
    </script>
</body>
</html>
